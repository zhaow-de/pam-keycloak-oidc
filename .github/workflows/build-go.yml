name: Build and publish
on:
  push:
    tags:
      # The 1.x line is tagged `r<version>`; from 2.0.0 the prefix is dropped.
      # Only `r*` tags exist on origin today, so the numeric pattern cannot
      # re-fire anything historical.
      - 'r*'
      - '[0-9]*'
  workflow_dispatch:

# The release step needs this; the archived actions silently relied on the
# repository's default token permission instead.
permissions:
  contents: write

jobs:
  build_and_publish:
    name: Build and publish the application
    runs-on: ubuntu-24.04
    steps:
      -
        name: Check out the repo
        uses: actions/checkout@v7
        with:
          # GoReleaser reads git history to resolve the version.
          fetch-depth: 0
      -
        name: Setup golang version
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.0'
      -
        name: Verify golang version
        run: go version
      -
        name: Cache go modules
        uses: actions/cache@v6
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      -
        name: Install dependencies
        run: go mod download
      -
        name: Build
        run: make all
      -
        # `make all` cannot fail: build_all runs `go build` inside $(shell ...),
        # which discards the exit code. Copying each expected binary under its
        # published name fails the job HERE if one is missing, before a release
        # exists. Keep this step ahead of the publish step: anything that creates
        # the release first leaves a public release carrying no binaries.
        name: Stage release assets under their published names
        run: |
          set -euo pipefail
          mkdir -p dist
          cp pam-keycloak-oidc.linux-amd64       dist/pam-keycloak-oidc.linux-amd64
          cp pam-keycloak-oidc.linux-arm64       dist/pam-keycloak-oidc.linux-arm64
          cp pam-keycloak-oidc.darwin-amd64      dist/pam-keycloak-oidc.macOS-intel
          cp pam-keycloak-oidc.darwin-arm64      dist/pam-keycloak-oidc.macOS-arm64
          cp pam-keycloak-oidc.windows-amd64.exe dist/pam-keycloak-oidc-amd64.exe
          cp pam-keycloak-oidc.windows-arm64.exe dist/pam-keycloak-oidc-arm64.exe
          ls -l dist
      -
        # GoReleaser builds ONLY the RPM/DEB packages (release.disable is set in
        # .goreleaser.yaml); the six binaries and the release itself stay with the
        # steps above and below.
        #
        # It reads the version from the tag itself, which works because 2.x tags
        # are bare semver. The 1.x line's `r<version>` tags are not semver and
        # GoReleaser would refuse them, so packaging is skipped there — that line
        # predates packaging and ships binaries only.
        name: Build the RPM and DEB packages
        if: ${{ !startsWith(github.ref_name, 'r') }}
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
      -
        name: Add the packages to the release assets
        if: ${{ !startsWith(github.ref_name, 'r') }}
        run: |
          set -euo pipefail
          cp dist-pkg/*.rpm dist-pkg/*.deb dist/
          ls -l dist
      -
        # Asset names are the basenames staged above and are a public contract
        # (.claude/rules/release.md) — every published release's download URLs
        # already carry them.
        name: Publish release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          # A prerelease tag carries a hyphenated suffix (2.0.0-a0); a stable one
          # never does. Without this an alpha becomes the "Latest release" and
          # every reader of the install docs downloads it instead of 1.x.
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          # Notes are GitHub's own "What's Changed" list, built from the PRs merged
          # since the previous tag — this repo keeps no CHANGELOG.md, so `/release`
          # pushes the tag and the notes are assembled here.
          generate_release_notes: true
          files: dist/*
